<div class="page">
    <div class="card">
        @if (fetchedCards() === null) {
            Loading...
        } @else if (currentCard(); as card) {
            @if (frontFacing) {
                {{ card.front }}
            } @else {
                {{ card.back }}
            }
        } @else {
            All done!
        }
    </div>
</div>
